name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Queue deploys so an older run can't overwrite a newer one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check deploy config
        run: |
          : "${API_ORIGIN:?Set the API_ORIGIN repository variable}"
          : "${WEB_ORIGIN:?Set the WEB_ORIGIN repository variable}"
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web
        run: pnpm turbo run build --filter=@safeport/web
        env:
          VITE_API_URL: ${{ vars.API_ORIGIN }}
      - name: Deploy
        run: |
          pnpm --filter @safeport/api exec wrangler deploy --var "ALLOWED_ORIGINS:$WEB_ORIGIN"
          pnpm --filter @safeport/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
