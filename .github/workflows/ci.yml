name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  preview:
    needs: [checks, dco]
    # Forks have no access to secrets, so they get checks but no preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      ALIAS: pr-${{ github.event.pull_request.number }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Work out preview URLs
        run: |
          echo "API_URL=https://$ALIAS-safeport-api-preview.$WORKERS_SUBDOMAIN.workers.dev" >> "$GITHUB_ENV"
          echo "WEB_URL=https://$ALIAS-safeport-web-preview.$WORKERS_SUBDOMAIN.workers.dev" >> "$GITHUB_ENV"
      - name: Build web
        run: pnpm turbo run build --filter=@safeport/web
        env:
          VITE_API_URL: ${{ env.API_URL }}
      - name: Upload previews
        run: |
          # A version can only be uploaded to a Worker that already exists.
          pnpm --filter @safeport/api exec wrangler deployments list --env preview \
            || pnpm --filter @safeport/api exec wrangler deploy --env preview --var "ALLOWED_ORIGINS:$WEB_URL"
          pnpm --filter @safeport/web exec wrangler deployments list --env preview \
            || pnpm --filter @safeport/web exec wrangler deploy --env preview
          pnpm --filter @safeport/api exec wrangler versions upload --env preview \
            --preview-alias "$ALIAS" --var "ALLOWED_ORIGINS:$WEB_URL"
          pnpm --filter @safeport/web exec wrangler versions upload --env preview \
            --preview-alias "$ALIAS"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment preview URLs
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Preview:** $WEB_URL (API: $API_URL/health)"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
